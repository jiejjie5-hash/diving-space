<!DOCTYPE NETSCAPE-Bookmark-file-1>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>

<style>
:root {
    --bg-pink: #ffeef2;
    --bg-green: #e8f7f0;
    --pink-accent: rgb(245, 109, 140);
    --text-color: #3c4043;
    --card-padding: 24px 32px;
    --folder-gap: 80px;
}

body {
    font-family: 'Product Sans', 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    padding: 80px 50px;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-green) 100%) no-repeat fixed;
    color: var(--text-color);
    line-height: 1.5;
}

h1 { font-size: 3rem; font-weight: 900; text-align: center; margin-bottom: 60px; color: var(--pink-accent); }

/* 工具栏 */
.toolbar { max-width: 900px; margin: 0 auto 80px auto; display: flex; flex-direction: column; gap: 30px; }
.search-container { display: flex; align-items: center; background: white; padding: 18px 35px; border-radius: 60px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
.kaomoji { margin-right: 25px; color: var(--pink-accent); font-weight: bold; font-size: 14px; width: 80px; text-align: center; }
.search-input { width: 100%; border: none; outline: none; font-size: 16px; background: transparent; }

.admin-bar { display: flex; gap: 20px; justify-content: center; }
.btn { padding: 14px 28px; border-radius: 40px; border: none; background: white; color: #70757a; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
.btn:hover { background: var(--pink-accent); color: white; transform: translateY(-2px); }

/* 布局控制 */
#main-container { max-width: 1200px; margin: 0 auto; }
.folder-box { background: rgba(255, 255, 255, 0.35); padding: 50px; border-radius: 45px; margin-bottom: var(--folder-gap); position: relative; border: 1px solid rgba(255, 255, 255, 0.5); }
.folder-header { display: flex; align-items: center; gap: 20px; margin-bottom: 35px; }
.folder-name { font-size: 1.6rem; font-weight: 800; outline: none; border-radius: 10px; padding: 2px 10px; }
.folder-name:focus { background: white; }

.grid { display: flex; flex-wrap: wrap; gap: 25px; min-height: 80px; padding: 10px; border-radius: 20px; transition: 0.3s; }
.drag-over { background: rgba(255,255,255,0.5); outline: 2px dashed var(--pink-accent); }

/* 网页卡片 */
.card { display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.85); padding: var(--card-padding); border-radius: 35px; border: 1px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.02); transition: all 0.4s ease; cursor: grab; position: relative; min-width: 200px; }
.card:hover { transform: translateY(-8px); background: white; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
.card-top { display: flex; align-items: center; pointer-events: none; } 
.favicon { width: 22px; height: 22px; margin-right: 18px; pointer-events: auto; cursor: pointer; }
.name { font-weight: 700; outline: none; font-size: 16px; pointer-events: auto; cursor: text; }
.note { font-size: 12px; color: #9aa0a6; margin-top: 10px; outline: none; min-height: 14px; pointer-events: auto; cursor: text; padding: 4px; border-radius: 8px; }
.note:focus { background: #f8f9fa; color: #3c4043; }
.url-edit { font-size: 10px; color: #bdc1c6; margin-top: 12px; outline: none; word-break: break-all; display: none; pointer-events: auto; cursor: text; }
.card:hover .url-edit { display: block; }

/* 删除按钮 */
.close-btn { position: absolute; top: 15px; right: 20px; color: #dadce0; font-size: 20px; opacity: 0; transition: 0.2s; cursor: pointer; z-index: 10; font-style: normal; }
.card:hover .close-btn, .folder-box:hover > .close-btn { opacity: 1; }
.close-btn:hover { color: #80868b; }

.dragging { opacity: 0.1 !important; }
</style>

<div class="toolbar">
    <div class="search-container">
        <span class="kaomoji" id="randomKaomoji"></span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索网页名称、链接或备注...">
    </div>
    <div class="admin-bar">
        <button class="btn" onclick="addFolder()">文件夹</button>
        <button class="btn" onclick="addLink()">网页</button>
    </div>
</div>

<div id="main-container"></div>

<script>
// 1. 全量恢复所有网页数据
const INITIAL_DATA = [
    { id: 'f_img', title: "图像", children: [
        { name: "CGTrader", url: "https://www.cgtrader.com/", note: "3D模型" },
        { name: "Mixkit", url: "https://mixkit.co/", note: "素材" },
        { name: "Wallhaven", url: "https://wallhaven.cc/", note: "壁纸" },
        { name: "doyoudo", url: "https://www.doyoudo.com/resources", note: "" },
        { name: "找字体", url: "https://www.zfont.cn/", note: "" },
        { name: "触手AI", url: "https://www.acgnai.art/", note: "" },
        { name: "ArtStation", url: "https://www.artstation.com/", note: "" },
        { name: "堆友AI", url: "https://d.design/ai", note: "" },
        { name: "SauceNAO", url: "https://saucenao.com/", note: "" },
        { name: "LiblibAI", url: "https://www.liblib.art/", note: "" },
        { name: "WebDesignMuseum", url: "https://www.webdesignmuseum.org/", note: "" }
    ]},
    { id: 'f_mus', title: "音乐", children: [
        { name: "Native Instruments", url: "https://www.native-instruments.com/", note: "" },
        { name: "绘音律", url: "http://www.52by.vip/", note: "" },
        { name: "Cymatics", url: "https://cymatics.fm/", note: "" },
        { name: "音律屋", url: "http://yinlvwu.com/", note: "" },
        { name: "MyFreeMP3", url: "https://tools.liumingye.cn/music/", note: "" },
        { name: "洛星喵", url: "https://luoxing.gimovo.cn/", note: "" },
        { name: "VOCALOID", url: "https://voicebanks.imikufans.com/", note: "" },
        { name: "Suno AI", url: "https://suno.com/", note: "" }
    ]},
    { id: 'f_tech', title: "技术", children: [
        { name: "LookAE", url: "https://www.lookae.com/", note: "" },
        { name: "DeepL", url: "https://www.deepl.com/", note: "" },
        { name: "Pinokio", url: "https://pinokio.computer/", note: "" },
        { name: "通义千问", url: "https://tongyi.aliyun.com/", note: "" },
        { name: "Blender中国", url: "https://www.blendercn.org/", note: "" },
        { name: "Gemini", url: "https://gemini.google.com/", note: "" },
        { name: "Grok", url: "https://grok.dairoot.cn/", note: "" }
    ]},
    { id: 'f_ent', title: "娱乐", children: [
        { name: "萌导航", url: "https://www.rrnav.com/favorites/zxdm", note: "" },
        { name: "硬核影视", url: "https://yinghe.app/", note: "" },
        { name: "樱花动漫", url: "http://www.yinghua8.tv/", note: "" },
        { name: "图寻", url: "https://tuxun.fun/", note: "" },
        { name: "萌娘百科", url: "https://zh.moegirl.org.cn/", note: "" },
        { name: "次元城动画", url: "https://www.cycani.org/", note: "" },
        { name: "巴哈姆特", url: "https://ani.gamer.com.tw/", note: "" },
        { name: "AGE动漫", url: "https://www.agedm.org/", note: "" },
        { name: "肖琪模拟器", url: "https://bbs.xqemu.cn/", note: "" }
    ]},
    { id: 'f_stu', title: "学习", children: [
        { name: "高中历史课本", url: "https://zxkeben.szxuexiao.com/gz_lishi.html", note: "" },
        { name: "OldMaps", url: "https://www.oldmapsonline.org/", note: "" },
        { name: "NameChef", url: "https://www.namechef.co/cn/", note: "" }
    ]},
    { id: 'f_mob', title: "手机", children: [
        { name: "博视植物网", url: "https://flora.naturestore.com.tw/", note: "" },
        { name: "ChatGPT", url: "https://chatgpt.com/", note: "" },
        { name: "Sonolus", url: "https://sonolus.com/", note: "" },
        { name: "莱博雷生", url: "https://www.overdose.day/", note: "" }
    ]}
];

let state = JSON.parse(localStorage.getItem('ultra_fav_final')) || INITIAL_DATA;
let historyStack = [];
const kaomojis = ["(－‸－)", "(๑•̀ㅂ•́)و", "(〃'▽'〃)", "(ﾉ´▽｀)ﾉ", "_(:з」∠)_", "(ﾟ▽ﾟ*)", "( ఠൠఠ )", "(^з^)-☆"];

function pushHistory() {
    if (historyStack.length > 40) historyStack.shift();
    historyStack.push(JSON.stringify(state));
}

function save() { localStorage.setItem('ultra_fav_final', JSON.stringify(state)); }

function undo() {
    if (historyStack.length > 0) {
        state = JSON.parse(historyStack.pop());
        render(); save();
    }
}

function render() {
    const container = document.getElementById('main-container');
    container.innerHTML = '';
    renderRecursive(state, container);
}

function renderRecursive(data, container) {
    data.forEach((item, index) => {
        if (item.children) {
            const folder = document.createElement('div');
            folder.className = 'folder-box';
            folder.innerHTML = `
                <i class="close-btn">×</i>
                <div class="folder-header"><span class="folder-name" contenteditable="true">${item.title}</span></div>
                <div class="grid"></div>
            `;
            const nameEl = folder.querySelector('.folder-name');
            nameEl.onblur = () => { if(nameEl.innerText !== item.title) { pushHistory(); item.title = nameEl.innerText; save(); } };
            folder.querySelector('.close-btn').onclick = () => { pushHistory(); data.splice(index, 1); render(); save(); };

            const grid = folder.querySelector('.grid');
            renderRecursive(item.children, grid);
            
            grid.ondragover = (e) => { e.preventDefault(); grid.classList.add('drag-over'); };
            grid.ondragleave = () => grid.classList.remove('drag-over');
            grid.ondrop = (e) => {
                e.preventDefault();
                grid.classList.remove('drag-over');
                const dragInfo = JSON.parse(e.dataTransfer.getData('text/plain'));
                handleDrop(dragInfo, item.children);
            };

            container.appendChild(folder);
        } else {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.innerHTML = `
                <i class="close-btn">×</i>
                <div class="card-top">
                    <img class="favicon" src="https://www.google.com/s2/favicons?domain=${item.url}" title="点击访问">
                    <span class="name" contenteditable="true">${item.name}</span>
                </div>
                <div class="note" contenteditable="false">${item.note || '...'}</div>
                <div class="url-edit" contenteditable="true">${item.url}</div>
            `;
            
            const favicon = card.querySelector('.favicon');
            const nameEl = card.querySelector('.name');
            const noteEl = card.querySelector('.note');
            const urlEl = card.querySelector('.url-edit');

            favicon.onclick = (e) => { e.stopPropagation(); window.open(item.url, '_blank'); };
            card.ondblclick = (e) => {
                e.stopPropagation();
                noteEl.contentEditable = "true";
                noteEl.focus();
            };

            nameEl.onblur = () => { if(nameEl.innerText !== item.name) { pushHistory(); item.name = nameEl.innerText; save(); } };
            noteEl.onblur = () => { if(noteEl.innerText !== item.note) { pushHistory(); item.note = noteEl.innerText; save(); } noteEl.contentEditable = "false"; };
            urlEl.onblur = () => { if(urlEl.innerText !== item.url) { pushHistory(); item.url = urlEl.innerText; save(); render(); } };
            card.querySelector('.close-btn').onclick = (e) => { e.stopPropagation(); pushHistory(); data.splice(index, 1); render(); save(); };

            card.ondragstart = (e) => {
                e.stopPropagation();
                const dragInfo = { sourceData: item };
                e.dataTransfer.setData('text/plain', JSON.stringify(dragInfo));
                setTimeout(() => card.classList.add('dragging'), 0);
            };
            card.ondragend = () => card.classList.remove('dragging');

            container.appendChild(card);
        }
    });
}

function handleDrop(dragInfo, targetList) {
    pushHistory();
    const findAndRemove = (list) => {
        for (let i = 0; i < list.length; i++) {
            if (list[i].url === dragInfo.sourceData.url && list[i].name === dragInfo.sourceData.name) {
                return list.splice(i, 1)[0];
            }
            if (list[i].children) {
                const found = findAndRemove(list[i].children);
                if (found) return found;
            }
        }
    };
    const movedItem = findAndRemove(state);
    if (movedItem) { targetList.push(movedItem); render(); save(); }
}

document.getElementById('randomKaomoji').innerText = kaomojis[Math.floor(Math.random() * kaomojis.length)];

function addFolder() {
    pushHistory();
    state.unshift({ title: "新文件夹", children: [] }); // unshift 放到最顶端
    render(); save();
}

function addLink() {
    pushHistory();
    state.unshift({ name: "新网页", url: "https://www.google.com", note: "" }); // unshift 放到最顶端
    render(); save();
}

window.onkeydown = (e) => { if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); } };

document.getElementById('searchInput').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
    });
};

render();
</script>
</html>
